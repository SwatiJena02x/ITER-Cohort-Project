services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: proctoring
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    command: uvicorn proctoring_assistant.api:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/proctoring
      VECTOR_DB_PATH: /app/data/vector_store
      OLLAMA_URL: http://host.docker.internal:11434
    ports:
      - "8000:8000"
    volumes:
      - vector_store:/app/data/vector_store
      - app_data:/app/data
    depends_on:
      - postgres

  ui:
    build: .
    command: streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/proctoring
      VECTOR_DB_PATH: /app/data/vector_store
      OLLAMA_URL: http://host.docker.internal:11434
    ports:
      - "8501:8501"
    volumes:
      - vector_store:/app/data/vector_store
      - app_data:/app/data
    depends_on:
      - postgres

volumes:
  postgres_data:
  vector_store:
  app_data:
