<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Notice Board · ProctorIQ</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/theme.css?v=25"/>
  <link rel="stylesheet" href="css/dashboard.css?v=25"/>
  <style>
    .nb-card {
      background: var(--clr-surface);
      border-radius: var(--radius-xl);
      border: 1px solid var(--clr-border);
      box-shadow: var(--shadow-md);
      margin-bottom: 16px;
      overflow: hidden;
      transition: var(--transition);
    }
    .nb-card:hover { box-shadow: var(--shadow-lg); border-color: #bfdbfe; }
    .nb-card.unread { border-left: 4px solid var(--clr-primary); }
    .nb-card.unread .nb-header { background: linear-gradient(135deg, #eff6ff, #f5f3ff); }
    .nb-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--clr-border);
      background: var(--clr-surface-2);
      flex-wrap: wrap; gap: 8px;
    }
    .nb-body { padding: 20px; }
    .nb-title { font-weight: 700; font-size: 0.95rem; color: var(--clr-dark); display:flex; align-items:center; gap:8px; }
    .nb-meta  { font-size: 0.78rem; color: var(--clr-muted); }
    .score-inline { display: inline-flex; align-items: baseline; gap: 4px; }
    .score-big { font-size: 2rem; font-weight: 800; }
    .score-max { font-size: 1rem; color: var(--clr-muted); }
    .new-pulse {
      width: 8px; height: 8px; border-radius: 50%;
      background: #ef4444;
      display: inline-block;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%,100% { transform:scale(1); opacity:1; }
      50% { transform:scale(1.5); opacity:0.7; }
    }
  </style>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-content">
    <header class="topbar" id="topbar"></header>
    <main class="page-content animate-in">

      <div class="section-header">
        <h1 class="section-title">&#128226; Notice Board</h1>
        <p class="section-desc">Important announcements and updates from the administrator.</p>
      </div>

      <!-- Notices loaded dynamically from backend -->
      <div id="notices-container">
        <div style="text-align:center; padding:60px 20px; color:var(--clr-muted);">
          <div style="font-size:2rem; margin-bottom:12px;">&#9203;</div>
          <div style="font-weight:600;">Loading notices...</div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="js/theme.js?v=25"></script>
<script src="js/api.js?v=25"></script>
<script src="js/dashboard.js?v=25"></script>
<script>
function getLevelColor(level) {
  if (!level) return '#6b7280';
  const l = level.toUpperCase();
  if (l === 'HIGH' || l === 'CRITICAL') return '#ef4444';
  if (l === 'MEDIUM') return '#f59e0b';
  if (l === 'LOW') return '#10b981';
  return '#6b7280';
}
function getLevelBadgeClass(level) {
  if (!level) return 'badge-low';
  const l = level.toUpperCase();
  if (l === 'HIGH' || l === 'CRITICAL') return 'badge-high';
  if (l === 'MEDIUM') return 'badge-medium';
  return 'badge-low';
}
function getLevelIcon(level) {
  if (!level) return '&#128203;';
  const l = level.toUpperCase();
  if (l === 'HIGH' || l === 'CRITICAL') return '&#128308;';
  if (l === 'MEDIUM') return '&#129505;';
  return '&#128994;';
}

document.addEventListener('DOMContentLoaded', async () => {
  if (!guardRoute('student')) return;
  renderSidebar('noticeboard', 'student');
  renderTopbar('Notice Board');

  const container = document.getElementById('notices-container');

  try {
    const [profile, rawNotices] = await Promise.all([
      api.getMyProfile().catch(() => null),
      api.getMyNotices().catch(() => [])
    ]);

    const myStudentId = Number((profile && profile.id) || Auth.getUserId() || 0);
    const myStudentRoll = String((profile && (profile.roll_number || profile.student_code)) || '').trim().toLowerCase();
    const rawList = Array.isArray(rawNotices) ? rawNotices : [];

    const notices = rawList.filter(n => {
      if (!n) return false;
      if (n.student_id !== undefined && n.student_id !== null && myStudentId > 0) {
        if (Number(n.student_id) !== myStudentId) return false;
      }
      if (n.student_roll && myStudentRoll) {
        if (String(n.student_roll).trim().toLowerCase() !== myStudentRoll) return false;
      }
      return true;
    });

    notices.sort((a, b) => (Number(b.report_id || 0) - Number(a.report_id || 0)) || (new Date(b.created_at || 0) - new Date(a.created_at || 0)));

    if (notices && notices.length > 0) {

      container.innerHTML = notices.map(n => `
        <div class="nb-card unread">
          <div class="nb-header">
            <div class="nb-title">
              <span class="new-pulse" style="background:${getLevelColor(n.risk_level)};"></span>
              ${getLevelIcon(n.risk_level)} New Risk Report Available
            </div>
            <div class="nb-meta">&#128197; ${n.created_at ? n.created_at.slice(0, 10) : 'N/A'} &nbsp;|&nbsp; From: Administrator</div>
          </div>
          <div class="nb-body">
            <p style="font-size:0.88rem; color:var(--clr-muted); margin-bottom:16px; line-height:1.7;">
              ${n.summary || 'Your examination risk report is ready for download.'}
            </p>
            <div style="display:flex; gap:20px; align-items:center; margin-bottom:16px; flex-wrap:wrap;">
              <div style="text-align:center;">
                <div style="font-size:0.75rem; color:var(--clr-muted); font-weight:600; margin-bottom:2px;">Risk Score</div>
                <div class="score-inline"><span class="score-big" style="color:${getLevelColor(n.risk_level)}">${n.risk_score}</span><span class="score-max">/100</span></div>
              </div>
              <div>
                <div style="font-size:0.75rem; color:var(--clr-muted); font-weight:600; margin-bottom:6px;">Risk Level</div>
                <span class="badge ${getLevelBadgeClass(n.risk_level)}" style="font-size:0.85rem; padding:5px 14px;">${n.risk_level || 'N/A'}</span>
              </div>
              <div style="flex:1;">
                <div style="font-size:0.75rem; color:var(--clr-muted); margin-bottom:6px; font-weight:600;">Score Progress</div>
                <div class="progress-bar-wrap">
                  <div class="progress-bar-fill" style="width:${n.risk_score}%; background:linear-gradient(90deg,${getLevelColor(n.risk_level)},${getLevelColor(n.risk_level)}cc);"></div>
                </div>
              </div>
            </div>
            <button class="btn-primary" onclick="window.open(api.getDownloadUrl('${n.report_id}'), '_blank')" style="gap:8px;">
              &#128229; Download Your Risk Report (PDF)
            </button>
            <a href="student-reports.html" class="btn-ghost" style="margin-left:8px;">View Full Report &#8594;</a>
          </div>
        </div>
      `).join('');
    } else {
      // No notices — clean empty state (no demo data)
      container.innerHTML = `
        <div style="text-align:center; padding:80px 20px; color:var(--clr-muted);">
          <div style="font-size:3.5rem; margin-bottom:16px;">&#128237;</div>
          <div style="font-size:1.1rem; font-weight:700; color:var(--clr-dark); margin-bottom:10px;">No Notices Yet</div>
          <div style="font-size:0.9rem; max-width:380px; margin:0 auto; line-height:1.7;">
            You have no risk reports or announcements at this time.<br/>
            Reports will appear here once your administrator publishes them after an examination session.
          </div>
        </div>
      `;
    }
  } catch (err) {
    container.innerHTML = `
      <div style="text-align:center; padding:60px 20px; color:#ef4444;">
        <div style="font-size:2rem; margin-bottom:12px;">&#9888;&#65039;</div>
        <div style="font-weight:600;">Could not load notices. Please refresh the page.</div>
      </div>
    `;
  }
});
</script>
</body>
</html>
