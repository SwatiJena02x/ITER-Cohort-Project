<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Risk Reports · ProctorIQ</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/theme.css?v=25"/>
  <link rel="stylesheet" href="css/dashboard.css?v=25"/>
  <style>
    .report-card-stu {
      background: var(--clr-surface);
      border: 1px solid var(--clr-border);
      border-radius: var(--radius-xl);
      overflow: hidden;
      box-shadow: var(--shadow-md);
      margin-bottom: 20px;
      transition: var(--transition);
    }
    .report-card-stu:hover { box-shadow: var(--shadow-lg); border-color: #bfdbfe; }

    .rcard-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--clr-border);
      background: var(--clr-surface-2);
    }
    .rcard-id   { font-size: 0.78rem; font-weight: 700; color: var(--clr-muted); }
    .rcard-date { font-size: 0.8rem; color: var(--clr-muted); }

    .rcard-body { padding: 20px; }

    .rcard-scores {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 20px;
      margin-bottom: 16px;
    }
    .rcard-score-num {
      font-size: 2.8rem;
      font-weight: 800;
      line-height: 1;
    }
    .rcard-score-bar-wrap { flex: 1; }
    .rcard-score-label { font-size: 0.78rem; color: var(--clr-muted); font-weight: 600; margin-bottom: 6px; }

    .rcard-student-info {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      background: #f8faff;
      border-radius: var(--radius-md);
      border: 1px solid #dbeafe;
      margin-bottom: 14px;
      font-size: 0.85rem;
    }

    .ai-explain {
      background: linear-gradient(135deg, #f5f3ff, #eff6ff);
      border: 1px solid #c4b5fd;
      border-radius: var(--radius-md);
      padding: 14px 16px;
      font-size: 0.85rem;
      line-height: 1.7;
      color: var(--clr-body);
      margin-bottom: 14px;
    }

    .rcard-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-top: 1px solid var(--clr-border);
      background: var(--clr-surface-2);
      flex-wrap: wrap;
      gap: 8px;
    }
  </style>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-content">
    <header class="topbar" id="topbar"></header>
    <main class="page-content animate-in">

      <div class="section-header">
        <h1 class="section-title">My Exam Risk Reports</h1>
        <p class="section-desc">Review AI-generated inspection summaries for your examination sessions.</p>
      </div>

      <!-- Container for dynamic risk reports -->
      <div id="student-reports-container">
        <div style="padding:40px; text-align:center; color:var(--clr-muted);">
          Loading risk reports...
        </div>
      </div>

    </main>
  </div>
</div>

<script src="js/theme.js?v=25"></script>
<script src="js/api.js?v=25"></script>
<script src="js/dashboard.js?v=25"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  if (!guardRoute('student')) return;
  renderSidebar('reports', 'student');
  renderTopbar('My Exam Risk Reports');

  const container = document.getElementById('student-reports-container');

  try {
    const [profile, noticesRes] = await Promise.all([
      api.getMyProfile().catch(() => null),
      api.getMyNotices().catch(() => [])
    ]);

    const myStudentId = Number((profile && profile.id) || Auth.getUserId() || 0);
    const myStudentRoll = String((profile && (profile.roll_number || profile.student_code)) || '').trim().toLowerCase();
    const rawReports = Array.isArray(noticesRes) ? noticesRes : [];

    const reports = rawReports.filter(r => {
      if (!r) return false;
      if (r.student_id !== undefined && r.student_id !== null && myStudentId > 0) {
        if (Number(r.student_id) !== myStudentId) return false;
      }
      if (r.student_roll && myStudentRoll) {
        if (String(r.student_roll).trim().toLowerCase() !== myStudentRoll) return false;
      }
      return true;
    });

    reports.sort((a, b) => (Number(b.report_id || 0) - Number(a.report_id || 0)) || (new Date(b.created_at || 0) - new Date(a.created_at || 0)));


    if (reports.length === 0) {
      container.innerHTML = `
        <div class="card" style="padding:48px 24px; text-align:center; color:var(--clr-muted);">
          <div style="font-size:2.8rem; margin-bottom:12px;">📋</div>
          <h3 style="font-size:1.15rem; font-weight:700; color:var(--clr-dark); margin-bottom:6px;">No Risk Reports Found</h3>
          <p style="font-size:0.88rem; max-width:400px; margin:0 auto;">No official exam risk reports have been published for your account yet.</p>
        </div>
      `;
      return;
    }

    const name = profile ? profile.full_name : 'Student';
    const roll = profile ? (profile.roll_number || profile.student_code || '') : '';
    const email = profile ? (profile.email || '') : '';
    const course = profile ? (profile.course || '') : '';
    const initials = getInitials(name);

    container.innerHTML = reports.map((r, idx) => {
      const rScore = Math.round(r.risk_score || 0);
      const rLevel = r.risk_level || 'UNKNOWN';
      const rColor = getLevelColor(rLevel);
      const rBadge = getLevelBadgeClass(rLevel);

      let rDate = 'N/A';
      if (r.created_at) {
        try {
          rDate = new Date(r.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
        } catch (_) {
          rDate = String(r.created_at).slice(0, 10);
        }
      }

      return `
        <div class="report-card-stu">
          <div class="rcard-header">
            <div>
              <div class="rcard-id">Risk Report #${r.report_id} &nbsp;·&nbsp; RPT-${r.report_id}</div>
            </div>
            <div class="rcard-date">📅 ${rDate}</div>
          </div>
          <div class="rcard-body">
            <div class="rcard-student-info">
              <div class="profile-big-avatar" style="width:38px;height:38px;font-size:0.9rem;border-radius:50%;background:linear-gradient(135deg,#2563eb,#7c3aed);display:flex;align-items:center;justify-content:center;color:white;font-weight:700;flex-shrink:0;">${initials}</div>
              <div>
                <div style="font-weight:700;">${name}</div>
                <div style="color:var(--clr-muted); font-size:0.78rem;">Roll: ${roll} ${email ? '· Email: ' + email : ''} ${course ? '· ' + course : ''}</div>
              </div>
            </div>
            <div class="rcard-scores">
              <div style="text-align:center;">
                <div style="font-size:0.75rem;color:var(--clr-muted);font-weight:600;margin-bottom:2px;">Risk Score</div>
                <div class="rcard-score-num" style="color:${rColor};">${rScore}</div>
                <div style="font-size:0.85rem; color:var(--clr-muted); font-weight:500;">/100</div>
              </div>
              <div>
                <div class="rcard-score-label">Risk Score Progress</div>
                <div class="progress-bar-wrap">
                  <div class="progress-bar-fill" style="width:${rScore}%; background:${rColor};"></div>
                </div>
              </div>
              <div style="text-align:center;">
                <div style="font-size:0.75rem;color:var(--clr-muted);font-weight:600;margin-bottom:6px;">Risk Level</div>
                <div style="font-size:1.3rem; font-weight:800; color:${rColor};">${rLevel} Risk</div>
                <span class="badge ${rBadge}" style="margin-top:6px;">${rLevel}</span>
              </div>
            </div>
            <div style="font-size:0.82rem; font-weight:700; color:var(--clr-dark); margin-bottom:8px;">🤖 AI Explanation</div>
            <div class="ai-explain">
              ${r.summary ? r.summary : 'Examination session risk assessment report.'}
            </div>
          </div>
          <div class="rcard-footer">
            <div style="font-size:0.8rem; color:var(--clr-muted);">Published by Administrator &nbsp;·&nbsp; ${rDate}</div>
            <button class="btn-primary" style="font-size:0.82rem; padding:0.5rem 1.2rem;" onclick="downloadPDF('${r.report_id}')">
              📥 Download Official Report (PDF)
            </button>
          </div>
        </div>
      `;
    }).join('');

  } catch (err) {
    console.error("Error loading student risk reports:", err);
    container.innerHTML = `
      <div class="card" style="padding:32px; text-align:center; color:var(--clr-muted);">
        Unable to load reports from server.
      </div>
    `;
  }
});

function downloadPDF(reportId) {
  if (reportId) {
    window.open(api.getDownloadUrl(reportId), '_blank');
  }
}
</script>
</body>
</html>
