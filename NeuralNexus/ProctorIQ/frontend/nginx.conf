server {
    listen 8080;
    server_name localhost;

    # Serve the HTML/CSS/JS frontend
    root /usr/share/nginx/html;
    index index.html;

    # SPA-style: serve index.html for any unknown path
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy all /api/* calls to the FastAPI backend container.
    # This means api.js talks to the SAME origin (port 8080),
    # so the API_BASE logic in api.js needs no changes.
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Proxy /uploads/, /reports/, /data/ to the backend (static file mounts)
    location ~* ^/(uploads|reports|data)/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
